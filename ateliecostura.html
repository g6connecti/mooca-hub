<h2>Ateliês de Costura na Mooca</h2>

<!-- Patrocinador (cópia idêntica de padarias) -->
<div class="patrocinador-box" style="margin: 0 0 25px 0; padding: 20px; background: rgba(0, 212, 255, 0.05); border: 1px solid #00ffff; border-radius: 12px; text-align: center;">
  <div style="display: inline-flex; align-items: center; justify-content: center; gap: 15px; max-width: 90%; margin: 0 auto;">
    <a href="https://seusite-patrocinador.com" target="_blank" style="text-decoration: none; flex-shrink: 0;">
      <img src="moocahub-58.png" alt="Nome do Patrocinador" style="max-width: 140px; height: auto;">
    </a>
    <div style="text-align: left;">
      <p style="margin: 0 0 4px 0; font-weight: bold; color: #00ffff; font-size: 1.05em;">
        Este módulo é patrocinado por:
      </p>
      <a href="https://seusite-patrocinador.com" target="_blank" style="text-decoration: none; color: #ff9800; font-weight: bold; font-size: 1.1em;">
        Nome do Patrocinador
      </a>
    </div>
  </div>
</div>

<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar ateliês..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput')?.addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.costura-btn');
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? 'flex' : 'none';
    });
  });
</script>

<div class="lista-estabelecimentos">
  <!-- Adicione aqui as costureiras / ateliês reais -->
  <button class="costura-btn" onclick="window.open('https://instagram.com/exemplo', '_blank')">
    <div class="btn-linha-topo"><strong>Ateliê Exemplo</strong></div>
    <span class="promo-texto-interno">Rua Exemplo, 123 - Mooca</span>
  </button>

  <!-- Mais itens conforme você fornecer -->
</div>

<button class="close-btn">Fechar</button>

<style>
  .lista-estabelecimentos { display: flex; flex-direction: column; gap: 10px; }
  .costura-btn {
    width: 100%; text-align: left; padding: 15px 20px; border-radius: 10px;
    background: rgba(0, 212, 255, 0.08); border: 1px solid #00ffff; color: #ffffff;
    transition: all 0.3s ease; cursor: pointer; display: flex; flex-direction: column;
  }
  .btn-linha-topo { display: flex; align-items: center; font-size: 1em; }
  .promo-texto-interno { font-size: 0.82em; color: #ff9800; margin-top: 4px; font-weight: normal; }
  .costura-btn:hover { background: rgba(0, 212, 255, 0.2); transform: translateY(-2px); }
  .patrocinador-box { margin-bottom: 25px; }
</style>
