<!-- Script de movimentação reforçado -->
<script>
  console.log('[Estabelecimentos] Script de busca iniciado');

  function tryMoveSearch() {
    const search = document.getElementById('globalSearchContainer');
    const placeholder = document.getElementById('searchPlaceholder');

    if (search && placeholder && !placeholder.contains(search)) {
      console.log('[Estabelecimentos] Campo encontrado → movendo agora!');
      placeholder.innerHTML = ''; // limpa qualquer coisa
      placeholder.appendChild(search);

      // Ajustes de estilo para ficar bonito abaixo do título
      search.style.margin = '0 auto 30px auto';
      search.style.width = '90%';
      search.style.maxWidth = '600px';
      const input = search.querySelector('input');
      if (input) {
        input.style.fontSize = '1.1em';
        input.style.padding = '14px';
      }

      // Para tudo (observer e intervalos)
      if (window.searchObs) window.searchObs.disconnect();
      clearInterval(window.searchInt);
      console.log('[Estabelecimentos] Campo movido com sucesso!');
    } else {
      console.log('[Estabelecimentos] Ainda aguardando campo...');
    }
  }

  // MutationObserver no #conteudo
  const target = document.getElementById('conteudo') || document.body;
  window.searchObs = new MutationObserver(() => tryMoveSearch());
  window.searchObs.observe(target, { childList: true, subtree: true });

  // Intervalo mais rápido e longo
  window.searchInt = setInterval(tryMoveSearch, 100);

  // Timeout de segurança (20 segundos)
  setTimeout(() => {
    clearInterval(window.searchInt);
    if (window.searchObs) window.searchObs.disconnect();
    const placeholder = document.getElementById('searchPlaceholder');
    if (placeholder && placeholder.children.length === 0) {
      placeholder.style.display = 'none'; // esconde se não achou nada
    }
    console.log('[Estabelecimentos] Tentativa de mover busca finalizada');
  }, 20000);
</script>
