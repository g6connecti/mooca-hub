<h2>Padarias na Mooca V-4</h2>

<!-- Campo de Patrocinador -->
<div class="patrocinador-box" style="margin: 0 0 25px 0; padding: 20px; background: rgba(0, 212, 255, 0.05); border: 1px solid #00ffff; border-radius: 12px; text-align: center;">
  <div style="display: inline-flex; align-items: center; justify-content: center; gap: 15px; max-width: 90%; margin: 0 auto;">
    <a href="https://seusite-patrocinador.com" target="_blank" style="text-decoration: none; flex-shrink: 0;">
      <img src="moocahub-58.png" alt="Nome do Patrocinador" style="max-width: 140px; height: auto;">
    </a>
    <div style="text-align: left;">
      <p style="margin: 0 0 4px 0; font-weight: bold; color: #00ffff; font-size: 1.05em;">
        Este módulo é patrocinado por:
      </p>
      <a href="https://seusite-patrocinador.com" target="_blank" style="text-decoration: none; color: #ff9800; font-weight: bold; font-size: 1.1em;">
        Nome do Patrocinador
      </a>
    </div>
  </div>
</div>

<!-- Campo de pesquisa -->
<div style="margin: 15px 0; text-align: center;">
  <input type="text" id="searchInput" placeholder="Pesquisar Padarias..." 
         style="width: 90%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #00ffff; background: #2a2a2a; color: #f0f0f0; font-size: 1em;">
</div>

<script>
  document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    const buttons = document.querySelectorAll('.padaria-btn');
    
    buttons.forEach(btn => {
      const text = btn.innerText.toLowerCase();
      btn.style.display = text.includes(filter) ? 'flex' : 'none';
    });
  });
</script>

<div class="lista-estabelecimentos">
  
  <!-- 1. Padaria Carillo (Destaque Neon) -->
  <button class="padaria-btn destaque-neon" onclick="window.open('https://padariacarillo.com.br', '_blank')">
    <div class="btn-linha-topo">
      <strong>Padaria Carillo</strong> <span class="promo-tag">Promoção</span>
    </div>
    <span class="promo-texto-interno">

    </span>
  </button>
  
  <!-- 2. Santa Branca -->

<button class="close-btn" onclick="fecharModulo()">Fechar</button>

<style>
  .lista-estabelecimentos {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .padaria-btn {
    width: 100%;
    text-align: left;
    padding: 15px 20px;
    border-radius: 10px;
    background: rgba(0, 212, 255, 0.08);
    border: 1px solid #00d4ff;
    color: #ffffff;
    transition: all 0.3s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    text-decoration: none;
  }

  .btn-linha-topo {
    display: flex;
    align-items: center;
    font-size: 1em;
  }

  .promo-texto-interno {
    font-size: 0.82em;
    color: #ff9800;
    margin-top: 4px;
    font-weight: normal;
  }

  .promo-tag {
    background: #ff9800;
    color: #121212;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.7em;
    font-weight: bold;
    margin-left: 10px;
  }

  .destaque-neon {
    border: 2px solid #00d4ff !important;
    background: rgba(0, 212, 255, 0.15) !important;
    animation: glow-unico 3s infinite ease-in-out;
  }

  @keyframes glow-unico {
    0% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.3); }
    50% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.6); }
    100% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.3); }
  }

  .padaria-btn:hover {
    background: rgba(0, 212, 255, 0.2);
    transform: translateY(-2px);
  }

  .patrocinador-box { margin-bottom: 25px; }
</style>
